name: ruff

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ruff
        run: pip install ruff==0.15.13
      - name: Run ruff check
        run: ruff check --output-format=github
      - name: Run ruff format check
        run: ruff format --check
